# Local ChatGPT login only; version-dependent / 仅限本地 ChatGPT 登录，依赖版本。
# Put this root key BEFORE all tables / 根级键须置于所有表之前。
model_provider = "openai-http"

# Append this table only if the ID is unused / 仅在此 ID 未占用时追加该表。
